<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bee one on the top</title>

<style>
    body{
        
        color: lime;
       background-color: black;
       font-family: monospace;
       display: block;
       overflow:visible;
       
    
    
    }
    .container{
       display: flex;
        gap: 15px;
        padding: 20px;
        grid-template-columns: reapeat(2.1fr);
        width: 340px;

    }
    fieldset{
        display: grid;
        gap: 5px;
        padding: 10px;
        grid-template-columns: reapeat(2.1fr);
        text-align: center;
        align-items: center;
       
        color: lime;
        border-radius: 5px;
        box-shadow: inset 0 0 10px lime;
         border: 1px solid lime;
         margin: 10px;
    }
    p{
        border: 2px solid lime;
        border-radius: 5px;
        height: 40px;
        width: 70px;
        cursor: pointer;
        
       
    }
    

</style>
</head>
<body>

<div class="container">
<fieldset>
    <h1>[VIP] BUY LEVEL WITH MONEY</h1>
    <div class="container">
        <p>level:2=(0.6$)</p>
        <p>level:3=(1$)</p>
        <p>level:4=(1.3$)</p>
        <p>level:5=(1.5$)</p>
       
    </div>
</fieldset>
<fieldset>
    <h2>[VIP] BUY LEVEL WITH COIN</h2>
<div class="container">
<p>level:2=(5010c)</p>
<p>level:3=(8500c)</p>
<p>level:4=(12000c)</p>
<p>level:5=(15000c)</p>

</div>
</fieldset>
<fieldset>
    <h2>[VIP] BUY COIN WITH MONEY</h2>
<div class="container">
<p>(5000c):-=0.5$</p>
<p>(15000c):-=1.2$</p>
<p>(20000c):-=1.5$</p>
<p>(50000c):-=3$</p>

</div>
</fieldset>

</div>
</body>
</html>
